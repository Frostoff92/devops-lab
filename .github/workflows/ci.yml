name: CI Day 1

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint project
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install flask pytest

      - name: Run tests
        run: |
          python -m pytest

      - name: Build Docker Image
        run: |
          docker build -t frost-webapp:ci .

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag Docker image
        run: |
          docker tag frost-webapp:ci ghcr.io/frostoff92/frost-webapp:latest

      - name: Push Docker image
        run: |
          docker push ghcr.io/frostoff92/frost-webapp:latest

      - name: Smoke test Docker container
        run: |
          docker run -d --name frost-webapp -p 8080:5000 frost-webapp:ci
          sleep 5
          docker ps
          docker logs frost-webapp
          curl http://localhost:8080

      - name: Show runner info
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "GitHub ref: $GITHUB_REF"
          echo "Commit SHA: $GITHUB_SHA"
          pwd
          ls -la

      - name: Show tool versions
        run: |
          git --version
          docker --version
          python3 --version
          pip3 --version
