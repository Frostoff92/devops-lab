name: CI Day 1

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:

  lint:
    name: Lint YAML
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate workflow file
        run: |
          cat .github/workflows/ci.yml

  tests:
    name: Run tests
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      APP_ENV: ci
      TEAM: frost-devops

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest > test-report.txt
          cat test-report.txt

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.txt

      - name: Show runner info
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "GitHub ref: $GITHUB_REF"
          echo "Commit SHA: $GITHUB_SHA"
          pwd
          ls -la

      - name: Show tool versions
        run: |
          git --version
          docker --version
          python3 --version
          pip3 --version

      - name: Show environment variables
        run: |
          echo "Environment: $APP_ENV"
          echo "Team: $TEAM"

      - name: Step-level environment variable
        env:
          TEMP_VALUE: step-only
        run: |
          echo "Temp value: $TEMP_VALUE"
          echo "App env still exists: $APP_ENV"

      - name: Verify TEMP_VALUE disappeared
        run: |
          echo "Temp value: $TEMP_VALUE"

  build:
    name: Build Docker image
    runs-on: ubuntu-24.04
    needs:
      - tests
      - lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download test report
        uses: actions/download-artifact@v4
        with:
          name: test-report

      - name: Show test-report
        run: |
          ls -la
          cat test-report.txt

      - name: Build Docker image
        run: |
          docker build -t frost-webapp:ci .

      - name: Smoke test Docker container
        run: |
          docker run -d --name frost-webapp -p 8080:5000 frost-webapp:ci
          sleep 5
          docker ps
          docker logs frost-webapp
          curl http://localhost:8080

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag Docker image
        run: |
          docker tag frost-webapp:ci ghcr.io/frostoff92/frost-webapp:latest

      - name: Push Docker image
        run: |
          docker push ghcr.io/frostoff92/frost-webapp:latest
