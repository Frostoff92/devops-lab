apiVersion: apps/v1
kind: Deployment
metadata:
  name: frost-webapp
  labels:
    app: frost-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frost-webapp
  template:
    metadata:
      labels:
        app: frost-webapp
    spec:
      containers:
        - name: frost-webapp
          image: ghcr.io/frostoff92/frost-webapp:v1.0.7
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
